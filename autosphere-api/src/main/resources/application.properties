# ---------------------------------------------------------------------------
# AutoSphere Motors API - application.properties
# ---------------------------------------------------------------------------

spring.application.name=autosphere-api
server.port=8080

# --- Database (PostgreSQL / Supabase) -----------------------------------
# 使用环境变量，未配置时默认落回本地/基础连接
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/autosphere_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Jackson Settings
spring.jackson.deserialization.fail-on-unknown-properties=false

# --- JWT -----------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_AT_LEAST_32_CHARS}
app.jwt.expiration-ms=86400000

# --- CORS / OAuth redirect target ----------------------------------------
app.client-url=${CLIENT_URL:http://localhost:3000}

# --- GitHub OAuth App ------------------------------------------------------
app.oauth.github.client-id=${GITHUB_CLIENT_ID:Ov23liBQC7IExzCc2ble}
app.oauth.github.client-secret=${GITHUB_CLIENT_SECRET:69c6ab92418734231ede6a81ee34b42e5f30045b}
app.oauth.github.redirect-uri=${GITHUB_REDIRECT_URI:http://localhost:8080/auth/github/callback}

