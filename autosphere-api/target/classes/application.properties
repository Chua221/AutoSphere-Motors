# ---------------------------------------------------------------------------
# AutoSphere Motors API - application.properties
# Fill in the MySQL credentials and OAuth secrets for your own machine.
# See README.md in the project root for full setup steps.
# ---------------------------------------------------------------------------

spring.application.name=autosphere-api
server.port=8080

# --- MySQL -------------------------------------------------------------
# Create the schema first:  CREATE DATABASE autosphere_db;
spring.datasource.url=jdbc:mysql://localhost:3306/autosphere_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=111111
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate creates/updates tables automatically from the entity classes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Extra fields sent by the React forms (e.g. id, sellerId) should never
# cause a 400 - only the declared DTO fields are ever applied.
spring.jackson.deserialization.fail-on-unknown-properties=false

# --- JWT -----------------------------------------------------------------
# Any long random string works; change it for your own deployment.
app.jwt.secret=CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_AT_LEAST_32_CHARS
app.jwt.expiration-ms=86400000

# --- CORS / OAuth redirect target ----------------------------------------
app.client-url=http://localhost:3000

